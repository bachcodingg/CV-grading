[project]
name = "cv-analyzer"
version = "0.1.0"
description = "Local, privacy-first CV grader for job seekers (see PLAN.md)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "dateparser>=1.2",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Zero-shot NER for skills / degrees / organisations (runs on CPU).
ner = ["gliner>=0.2"]
# Local LLM gap-filling through Ollama.
llm = ["ollama>=0.4"]
# OCR for scanned PDFs. Also needs the Tesseract binary on PATH.
ocr = ["pytesseract>=0.3", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
cv-analyzer = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs downloaded models (GLiNER) or a running Ollama server",
]
