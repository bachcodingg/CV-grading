# Canonical skill name -> aliases (PLAN.md §3 [5] step 2).
#
# Used by the JD parser (keywords for the ATS coverage check) and by the matcher
# (exact + alias matching). Matching is case-insensitive and respects token
# boundaries ("C" does not match inside "C-level", "Java" not inside "JavaScript").
# Names that are also ordinary English words are listed under `case_sensitive`
# and only match as written ("Go", not "go"; "React", not "react").
#
# Keep entries to concrete, checkable skills. Soft skills live in jd_parser.py.

